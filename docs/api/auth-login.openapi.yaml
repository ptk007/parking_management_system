openapi: 3.0.3
info:
  title: MFU Parking Management Auth API
  version: 0.1.0
  description: Login-only API spec for initial Thunder Client testing.
servers:
  - url: http://localhost:3000
    description: Local backend
tags:
  - name: Auth
    description: Login and token checks
paths:
  /health:
    get:
      tags:
        - Auth
      summary: Check API and database health
      operationId: getHealth
      responses:
        "200":
          description: API health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                connected:
                  value:
                    ok: true
                    database: connected
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login with username and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              staff:
                value:
                  username: thunder_staff
                  password: password123
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              examples:
                staff:
                  value:
                    token: eyJpZCI6IjZhNGUwMDllMmUxNzcxNWFiZWUyZDc0OSIsInVzZXJuYW1lIjoidGh1bmRlcl9zdGFmZiIsInJvbGUiOjIsImV4cCI6MTc4MzYyMDAwMDAwMH0.signature
                    user:
                      id: 6a4e009e2e17715abee2d749
                      username: thunder_staff
                      fullName: Thunder Staff
                      role: staff
                      buildingId: E4
                      floorId: "4"
                      status: online
                      avatar: TH
        "401":
          description: Invalid credentials or disabled user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCredentials:
                  value:
                    message: Invalid username or password
  /api/auth/verify:
    get:
      tags:
        - Auth
      summary: Verify the current bearer token
      operationId: verifyToken
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token is structurally valid and maps to a user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
              examples:
                valid:
                  value:
                    valid: true
                    user:
                      id: 6a4e009e2e17715abee2d749
                      username: thunder_staff
                      fullName: Thunder Staff
                      role: staff
                      buildingId: E4
                      floorId: "4"
                      status: online
                      avatar: TH
        "401":
          description: Missing, invalid, or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidToken:
                  value:
                    message: Invalid or expired token
                    code: INVALID_TOKEN
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Mark the current user as logged out
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
              examples:
                success:
                  value:
                    message: Logged out successfully
        "401":
          description: Missing, invalid, or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidToken:
                  value:
                    message: Invalid or expired token
                    code: INVALID_TOKEN
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HMAC
  schemas:
    HealthResponse:
      type: object
      required:
        - ok
        - database
      properties:
        ok:
          type: boolean
          example: true
        database:
          type: string
          enum:
            - connected
            - disconnected
          example: connected
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: thunder_staff
        password:
          type: string
          format: password
          example: password123
    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Backend signed token. Send it as a Bearer token for protected auth endpoints.
        user:
          $ref: "#/components/schemas/AuthUser"
    VerifyResponse:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
          example: true
        user:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AuthUser"
    LogoutResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Logged out successfully
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
          nullable: true
          example: INVALID_TOKEN
    AuthUser:
      type: object
      required:
        - id
        - username
        - fullName
        - role
        - buildingId
        - floorId
        - status
        - avatar
      properties:
        id:
          type: string
        username:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum:
            - user
            - staff
            - admin
        buildingId:
          type: string
        floorId:
          type: string
        status:
          type: string
          enum:
            - online
            - offline
            - disabled
        avatar:
          type: string
